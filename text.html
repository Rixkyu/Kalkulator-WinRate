<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator WR Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .tab-active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 flex justify-center items-start">

    <div class="w-full max-w-lg glass-card rounded-3xl p-6 md:p-8 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent italic">
                WR CALCULATOR PRO
            </h1>
            <p class="text-slate-400 text-sm mt-1">Kelola statistik game kamu dengan presisi</p>
        </div>

        <!-- Statistik Dasar -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-700">
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Total Match</label>
                <input type="number" id="baseMatch" placeholder="0" oninput="updateSim()"
                    class="w-full bg-transparent text-xl font-bold focus:outline-none text-blue-400">
            </div>
            <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-700">
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">WR Saat Ini (%)</label>
                <input type="number" id="baseWR" step="0.01" placeholder="0.00" oninput="updateSim()"
                    class="w-full bg-transparent text-xl font-bold focus:outline-none text-emerald-400">
            </div>
        </div>

        <!-- Tabs Navigasi -->
        <div class="flex border-b border-slate-700 mb-6">
            <button onclick="switchTab('target')" id="tab-target" class="flex-1 py-3 text-sm font-bold tab-active transition-all uppercase">Kejar Target</button>
            <button onclick="switchTab('simulasi')" id="tab-simulasi" class="flex-1 py-3 text-sm font-bold text-slate-500 transition-all uppercase">Rencana Win/Lose</button>
        </div>

        <!-- Konten: Kejar Target -->
        <div id="content-target" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-2 text-slate-300">Target Win Rate yang Ingin Dicapai (%)</label>
                <input type="number" step="0.01" id="targetWR" placeholder="Contoh: 60" 
                    class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>
            <button onclick="hitungTarget()" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all">
                Hitung Win Streak
            </button>
            <div id="resTarget" class="hidden p-4 bg-blue-900/20 rounded-xl border border-blue-500/30">
                <p id="txtTarget" class="text-center text-sm leading-relaxed"></p>
            </div>
        </div>

        <!-- Konten: Simulasi Win/Lose -->
        <div id="content-simulasi" class="hidden space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-400 uppercase">Rencana Menang</label>
                    <div class="relative">
                        <input type="number" id="planWin" value="0" oninput="updateSim()"
                            class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 focus:border-emerald-500 outline-none text-emerald-400 font-bold">
                        <span class="absolute right-3 top-3 text-xs text-slate-500">Match</span>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-400 uppercase">Rencana Kalah</label>
                    <div class="relative">
                        <input type="number" id="planLose" value="0" oninput="updateSim()"
                            class="w-full bg-slate-800/50 border border-slate-700 rounded-xl px-4 py-3 focus:border-red-500 outline-none text-red-400 font-bold">
                        <span class="absolute right-3 top-3 text-xs text-slate-500">Match</span>
                    </div>
                </div>
            </div>

            <div class="bg-gradient-to-br from-slate-900 to-slate-800 p-6 rounded-2xl border border-slate-700 text-center shadow-inner">
                <p class="text-slate-400 text-xs uppercase font-bold tracking-widest mb-2">Estimasi WR Baru</p>
                <h2 id="simResultWR" class="text-5xl font-black text-white">0.00%</h2>
                <div class="mt-4 pt-4 border-t border-slate-700 flex justify-around text-xs">
                    <div>
                        <p class="text-slate-500">Total Match</p>
                        <p id="simTotalMatch" class="font-bold text-slate-200">-</p>
                    </div>
                    <div>
                        <p class="text-slate-500">Total Menang</p>
                        <p id="simTotalWin" class="font-bold text-slate-200">-</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-800 text-center italic text-[10px] text-slate-600">
            Aplikasi ini hanya simulasi matematika. Hasil akhir di game mungkin berbeda karena pembulatan sistem game.
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const tBtn = document.getElementById('tab-target');
            const sBtn = document.getElementById('tab-simulasi');
            const tCon = document.getElementById('content-target');
            const sCon = document.getElementById('content-simulasi');

            if (tab === 'target') {
                tBtn.classList.add('tab-active');
                sBtn.classList.remove('tab-active');
                sBtn.classList.add('text-slate-500');
                tCon.classList.remove('hidden');
                sCon.classList.add('hidden');
            } else {
                sBtn.classList.add('tab-active');
                tBtn.classList.remove('tab-active');
                tBtn.classList.add('text-slate-500');
                sCon.classList.remove('hidden');
                tCon.classList.add('hidden');
            }
        }

        function hitungTarget() {
            const m = parseFloat(document.getElementById('baseMatch').value);
            const w = parseFloat(document.getElementById('baseWR').value);
            const t = parseFloat(document.getElementById('targetWR').value);
            const res = document.getElementById('resTarget');
            const txt = document.getElementById('txtTarget');

            if (!m || isNaN(w) || !t) {
                alert("Mohon lengkapi data statistik dasar dan target WR.");
                return;
            }

            if (t >= 100) {
                txt.innerHTML = "<span class='text-red-400'>Target tidak mungkin 100% atau lebih.</span>";
                res.classList.remove('hidden');
                return;
            }

            const currentWin = (m * w) / 100;
            
            if (t <= w) {
                txt.innerHTML = "<span class='text-yellow-400'>Target harus lebih tinggi dari WR saat ini.</span>";
            } else {
                const winStreakNeeded = Math.ceil((t * m - 100 * currentWin) / (100 - t));
                txt.innerHTML = `Kamu butuh sekitar <b class='text-blue-400 text-xl'>${winStreakNeeded}</b> kemenangan beruntun (tanpa kalah) untuk mencapai WR <b>${t}%</b>.`;
            }
            res.classList.remove('hidden');
        }

        function updateSim() {
            const m = parseFloat(document.getElementById('baseMatch').value) || 0;
            const w = parseFloat(document.getElementById('baseWR').value) || 0;
            const pW = parseInt(document.getElementById('planWin').value) || 0;
            const pL = parseInt(document.getElementById('planLose').value) || 0;

            const currentTotalWin = (m * w) / 100;
            const newTotalWin = currentTotalWin + pW;
            const newTotalMatch = m + pW + pL;

            const resWR = document.getElementById('simResultWR');
            const resMatch = document.getElementById('simTotalMatch');
            const resWin = document.getElementById('simTotalWin');

            if (newTotalMatch > 0) {
                const finalWR = (newTotalWin / newTotalMatch) * 100;
                resWR.innerText = finalWR.toFixed(2) + "%";
                resMatch.innerText = Math.floor(newTotalMatch);
                resWin.innerText = Math.floor(newTotalWin);

                // Warna indikator
                if (finalWR > w) resWR.className = "text-5xl font-black text-emerald-400";
                else if (finalWR < w) resWR.className = "text-5xl font-black text-red-400";
                else resWR.className = "text-5xl font-black text-white";
            } else {
                resWR.innerText = "0.00%";
                resMatch.innerText = "-";
                resWin.innerText = "-";
            }
        }
    </script>
</body>
</html>
